name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Node test harness (site contract/unit/browser tests) lives on
      # branches that carry the site (package.json present). On branches
      # without it, CI passes as a no-op rather than failing.
      - name: Detect test harness
        id: harness
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.harness.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.harness.outputs.present == 'true'
        run: npm ci

      - name: Unit and contract tests
        if: steps.harness.outputs.present == 'true'
        run: npm run test:unit

      - name: Install Playwright browsers
        if: steps.harness.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        if: steps.harness.outputs.present == 'true'
        run: npm run test:browser
